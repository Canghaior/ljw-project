server:
  port: 8080

spring:
  application:
    name: ljw-project
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/my_springboot_framework?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

login:
  # 手写 Token 的有效期，单位小时；可以通过环境变量覆盖。
  token-expire-hours: ${LOGIN_TOKEN_EXPIRE_HOURS:24}
