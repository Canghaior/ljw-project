server:
  port: 8080

spring:
  application:
    name: ljw-project
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/my_springboot_framework?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  # JWT 签名密钥：开发环境可以用默认值，生产环境必须通过 JWT_SECRET 环境变量覆盖。
  secret: ${JWT_SECRET:ljw-project-login-secret-key-please-change-32}
  # token 有效期，单位小时。
  expire-hours: ${JWT_EXPIRE_HOURS:24}
